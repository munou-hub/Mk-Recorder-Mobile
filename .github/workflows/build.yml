name: build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Ensure Android platform 34
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" || true

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        id: apk
        run: |
          VER=$(grep -o "versionName '[0-9.]*'" app/build.gradle | grep -o '[0-9.]*')
          cp app/build/outputs/apk/debug/app-debug.apk "MkRecorderMobile-v${VER}.apk"
          echo "path=MkRecorderMobile-v${VER}.apk" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MkRecorderMobile
          path: ${{ steps.apk.outputs.path }}

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.path }}
