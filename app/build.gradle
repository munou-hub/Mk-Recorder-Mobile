plugins {
    id 'com.android.application'
}

android {
    namespace 'jp.mk.recorder'
    compileSdk 34

    defaultConfig {
        applicationId 'jp.mk.recorder'
        minSdk 26
        targetSdk 34
        versionCode 7
        versionName '1.6'
    }

    buildTypes {
        debug {
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// 外部ライブラリ依存なし（Androidフレームワークのみ）
dependencies {
}
